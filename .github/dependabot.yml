version: 2

# 更新の PR は毎週月曜 09:00 JST に、エコシステムごとに 1 本へまとめて作る。
# ラベルは指定せず、Dependabot の既定（`dependencies` とエコシステム名のラベル）に任せる。

updates:
  # provider（versions.tf と .terraform.lock.hcl）
  - package-ecosystem: "terraform"
    # modules/ は入れない。.terraform.lock.hcl が無いディレクトリは現在のバージョンを
    # 特定できず、下の ignore が効かずにメジャー更新の PR が作られる
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
      include: "scope"
    # provider のメジャー更新は破壊的変更を伴い、コードの修正が要る。
    # 自動の PR では扱わず、手動で計画して上げる
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      terraform:
        patterns:
          - "*"

  # Lambda に同梱する Python パッケージ
  - package-ecosystem: "pip"
    directory: "/lambda"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pip:
        patterns:
          - "*"
